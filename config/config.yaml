corpus:
  repo_url: https://github.com/kubernetes/community.git
  raw_dir: data/raw/community
  manifest_path: data/manifest.json
  exclude_dirs: [archive, elections, events]
  exclude_patterns: [meeting-notes, minutes, 'README-[a-z]{2}\.md$']

cleaning:
  output_path: data/processed/docs.jsonl
  sample_path: data/processed/sample_10.txt
  min_chars: 100
  sample_size: 10
  seed: 42

chunking:
  input_path: data/processed/docs.jsonl
  output_path: data/processed/chunks.jsonl
  chunk_size: 200
  overlap: 30

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  chunks_path: data/processed/chunks.jsonl
  output_dir: data/embeddings
  batch_size: 64
  max_seq_length: 256
  add_title: true

index:
  chunks_path: data/processed/chunks.jsonl
  embeddings_dir: data/embeddings
  path: data/index/chroma
  collection: k8s_community
  space: cosine
  ef_search: 100

retrieval:
  rrf_k: 60
  candidates: 50
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_candidates: 20
  max_chunks_per_doc: 2

generation:
  model: qwen2.5:7b
  top_k: 5
  temperature: 0
  num_ctx: 4096